# API compartida del Cotizador ICR (base de datos PostgreSQL + API Node),
# adaptada para el VPS real de Inversiones ICR: ese VPS ya tiene Traefik
# sirviendo HTTPS para el ERP, la tienda y el Cotizador web (todos bajo
# n8n_default) — por eso acá NO hay Caddy ni se abren los puertos 80/443,
# a diferencia del docker-compose.yml original de este módulo. El build web
# (Flutter) y el finanzas-api/caddy de ese original no se tocan: los sirve
# el docker-compose.yml de la raíz del repo y, aparte, ya hay un
# finanzas.inversionesicr.com en producción (otro repo) — no se duplica acá.
#   1) cp .env.example .env   y completa los valores
#   2) docker compose up -d --build
name: icr-cotizador-servidor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cotizador
      POSTGRES_USER: icr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icr -d cotizador"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - interna
    # Sin "ports": la base solo se ve desde la API, nunca desde internet.

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://icr:${POSTGRES_PASSWORD}@db:5432/cotizador
      # El ERP se llama por su dominio público, no por red interna de Docker
      # (llamada servidor-a-servidor, no necesita unirse a la red del ERP).
      ERP_API_URL: ${ERP_API_URL:-https://erp.inversionesicr.com/api}
      CLAVE_EDICION: ${CLAVE_EDICION:-1234}
      TZ: America/Lima
    volumes:
      - uploads:/app/uploads
    networks:
      - interna
      - traefik_public
    labels:
      - "traefik.enable=true"
      # Nombre REAL de la red de Docker (n8n_default), no un alias — mismo
      # hallazgo que en ICR-TIENDA/ICR-LOGISTICA/el Cotizador web.
      - "traefik.docker.network=n8n_default"
      # Mismo dominio que ya usa la app web (cotizador.inversionesicr.com),
      # NO un subdominio nuevo: /api y /uploads, como el resto del
      # ecosistema. El Express de este backend ya espera el prefijo /api
      # internamente (ver api/src/index.js: app.use('/api', crearRutas())) y
      # /uploads lo sirve en la raíz, así que ninguna de las dos rutas
      # necesita StripPrefix.
      - "traefik.http.routers.icr-cotizador-srv.rule=Host(`${DOMAIN:-cotizador.inversionesicr.com}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.icr-cotizador-srv.entrypoints=websecure"
      - "traefik.http.routers.icr-cotizador-srv.tls=true"
      # "letsencrypt" no existe como certResolver en el Traefik de este VPS
      # — el único definido es "mytlschallenge" (mismo hallazgo ya
      # documentado). El certificado del dominio ya existe (lo emitió el
      # router de la app web) — este router lo reusa, mismo dominio.
      - "traefik.http.routers.icr-cotizador-srv.tls.certresolver=mytlschallenge"
      # Bien alto a propósito: que no dependa de cómo calcule Traefik la
      # prioridad automática del router Host-a-secas de la app web.
      - "traefik.http.routers.icr-cotizador-srv.priority=999999"
      - "traefik.http.services.icr-cotizador-srv.loadbalancer.server.port=3000"

volumes:
  pgdata:
  uploads:

networks:
  # Red propia de este stack (Postgres <-> API) — no se expone a internet.
  interna:
  # Misma red compartida de Traefik que ya usan el ERP, la tienda, finanzas
  # y el Cotizador web en este VPS (n8n_default) — no una red nueva.
  traefik_public:
    name: n8n_default
    external: true
