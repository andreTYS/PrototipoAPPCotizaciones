name: cotizador_icr
description: App móvil para armar cotizaciones por checklist de productos, con datos locales y sincronización opcional desde el servidor local.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  pdf: ^3.11.0
  printing: ^5.13.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  sqflite_common_ffi_web: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/productos_seed.json
    - assets/productos/
    - assets/icon/icon.png
  # Empaquetada localmente (no vía Google Fonts en tiempo de ejecución) para
  # que el texto se vea en la build web/PWA aunque el navegador no pueda
  # llegar a fonts.gstatic.com (red restringida, filtro corporativo, sin
  # señal) — mismo criterio "funciona sin depender de internet" que ya
  # aplica al catálogo offline y a la generación del PDF.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
