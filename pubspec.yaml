name: cotizador_icr
description: App móvil para armar cotizaciones por checklist de productos, con datos locales y sincronización opcional desde el servidor local.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  pdf: ^3.11.0
  printing: ^5.13.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  sqflite_common_ffi_web: ^1.0.2
  lottie: ^3.5.1
  flutter_svg: ^2.0.10+1
  speech_to_text: ^7.5.0
  flutter_local_notifications: ^22.3.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/productos_seed.json
    - assets/checklist_seed.json
    - assets/productos/
    - assets/icon/icon.png
    - assets/animations/
    - assets/icons/
  # Empaquetadas localmente (no vía Google Fonts en tiempo de ejecución) para
  # que el texto se vea en la build web/PWA aunque el navegador no pueda
  # llegar a fonts.gstatic.com (red restringida, filtro corporativo, sin
  # señal) — mismo criterio "funciona sin depender de internet" que ya
  # aplica al catálogo offline y a la generación del PDF.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Dancing Script
      fonts:
        - asset: assets/fonts/DancingScript-Bold.ttf
          weight: 700
