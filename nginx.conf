server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web no versiona los nombres de archivo (main.dart.js,
    # flutter_service_worker.js, etc. se llaman siempre igual entre builds):
    # si el navegador los guarda en su caché HTTP normal, el propio service
    # worker termina "actualizándose" leyendo una copia vieja desde esa
    # caché en vez de pedirle al servidor el archivo nuevo — por eso una
    # recarga fuerte (Ctrl+Shift+R) no alcanza para ver un despliegue nuevo
    # en una pestaña que ya tenía la app abierta antes. Sin caché HTTP acá,
    # el service worker de Flutter (que sí sabe versionar su propio caché
    # interno) siempre ve la versión real del servidor.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
