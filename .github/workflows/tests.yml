name: Tests

on:
  push:
    branches: [ main ]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Analizar (flutter analyze)
        run: flutter analyze

      - name: Correr tests
        run: flutter test
