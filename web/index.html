<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Cotizaciones, requerimientos y herramientas de Inversiones ICR, compartidos entre todo el equipo.">
  <meta name="theme-color" content="#0D2233">

  <!-- iOS: instalar en la pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ICR Energy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ICR Energy</title>
  <link rel="manifest" href="manifest.json">

  <!-- Para mostrar y compartir los PDF (paquete printing) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.2.146/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.2.146/pdf.worker.min.js';
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #0D2233; gap: 14px; }
    #cargando img { width: 84px; height: 84px; }
  </style>
</head>
<body>
  <div id="cargando"><img src="icons/Icon-192.png" alt=""><div>Cargando ICR Energy…</div></div>
  <script>
    // Quita la pantalla de carga cuando Flutter ya dibujó la app.
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('cargando');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
